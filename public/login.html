<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameVault — sign in</title>
<link rel="stylesheet" href="/style.css">
<style>
  .login-wrap { max-width: 380px; margin: 12vh auto; padding: 0 20px; }
  .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px; }
  .login-card h1 { font-size: 22px; margin: 0 0 4px; }
  .login-card p { color: var(--dim); font-size: 14px; margin: 0 0 20px; }
  .login-card input { width: 100%; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 15px; }
  .login-card button { width: 100%; margin-top: 12px; padding: 12px; }
  .err { color: #fca5a5; font-size: 14px; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>GameVault</h1>
    <p>Sign in to see your library and prices.</p>
    <form id="f">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit">Sign in</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
const f = document.getElementById('f');
const err = document.getElementById('err');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  const btn = f.querySelector('button');
  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }),
    });
    const d = await res.json().catch(() => ({}));
    if (res.ok) { location.href = '/'; return; }
    err.textContent = d.error || 'Sign in failed.';
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
