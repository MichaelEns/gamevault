name: Verify sealed-box encryption

# Temporary. Proves that a secret encrypted by lib/github-secrets.mjs -- the
# same code path the PWA uses -- is one GitHub can actually decrypt. Accepting
# the PUT only proves the base64 parsed; it says nothing about correctness.
#
# The value is never printed. Only a SHA-256 comparison is, so the log reveals
# nothing even though this canary is not sensitive.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare the decrypted canary against its expected hash
        env:
          CANARY: ${{ secrets.GAMEVAULT_CANARY }}
        run: |
          if [ -z "$CANARY" ]; then
            echo "::error::Secret is empty - GitHub could not decrypt it."
            exit 1
          fi
          EXPECTED=$(printf '%s' 'gamevault-sealed-box-probe-4f2a91' | sha256sum | cut -d' ' -f1)
          ACTUAL=$(printf '%s' "$CANARY" | sha256sum | cut -d' ' -f1)
          echo "length: ${#CANARY}"
          echo "expected sha256: $EXPECTED"
          echo "actual   sha256: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Decrypted value does not match - the sealed box is malformed."
            exit 1
          fi
          echo "Sealed box round-trips correctly."
