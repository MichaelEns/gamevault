name: Build snapshot and publish

# Why a snapshot rather than a live server:
# Steam, GOG, Game Pass and ITAD all refuse cross-origin browser requests,
# and API keys must never reach client-side code. So the work happens here,
# where secrets are safe, and the phone reads a static encrypted file.

on:
  schedule:
    # Every 6 hours. Ownership and subscription data barely move; prices are
    # the volatile part, and the app labels how old they are.
    # Note: cron on public repos is best-effort and can be delayed under
    # load, which is why workflow_dispatch exists.
    - cron: '0 */6 * * *'
  workflow_dispatch:        # manual trigger - works from the GitHub mobile app
  push:
    branches: [main]
    paths:
      - 'watchlist.txt'     # rebuild immediately when the watchlist changes
      - 'lib/**'
      - 'site/**'
      - 'tools/build-snapshot.mjs'
      - '.github/workflows/snapshot.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  # For the claim-failure notification: an issue opened by the Actions bot is
  # what emails the repository owner, and needs no SMTP credentials.
  issues: write

# Never let two builds publish at once.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # There was no install step at all, which went unnoticed for a long
        # time because everything the build did used only Node built-ins. The
        # moment real dependencies appeared - tweetnacl and blakejs, for
        # sealing the rotated credentials - they were simply absent, and the
        # write-back failed with "Cannot find package 'blakejs'" while the rest
        # of the build carried on looking healthy.
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Verify the crypto dependencies are actually present
        # Sealing a secret is the one step that silently costs something when
        # it fails: rotating credentials stop being refreshed and every
        # provider that uses one dies a build later, for reasons that point
        # nowhere near this.
        run: |
          node -e "
            Promise.all([import('tweetnacl'), import('blakejs')])
              .then(() => console.log('tweetnacl and blakejs are available.'))
              .catch((e) => { console.error('::error::' + e.message); process.exit(1); });
          "

      # Optional: Epic and Amazon ownership.
      # These CLIs cannot do a browser login in CI, so their tokens are
      # restored from secrets. Skipped cleanly when the secrets are absent -
      # every other provider still works.
      - name: Restore game-client tokens
        env:
          LEGENDARY_CONFIG: ${{ secrets.LEGENDARY_CONFIG }}
          NILE_CONFIG: ${{ secrets.NILE_CONFIG }}
        run: |
          # Both secrets are now a base64 ZIP of the client's whole config
          # directory, not a single file. nile in particular keeps its
          # credentials in user.enc (AES) with the key derived from an account
          # id held in a SEPARATE plaintext file, so any single-file copy
          # captures the ciphertext or the key but never both.
          restore() {
            local blob="$1" dest="$2" name="$3"
            [ -z "$blob" ] && return 0
            mkdir -p "$dest"
            echo "$blob" | base64 -d > /tmp/$name.zip 2>/dev/null || {
              echo "::warning::$name config is not valid base64; skipping."
              return 1
            }
            if unzip -o -q /tmp/$name.zip -d "$dest" 2>/dev/null; then
              echo "$name config restored:"; ls -1 "$dest"
            else
              # Older secrets were a single base64 file rather than a ZIP.
              echo "$blob" | base64 -d > "$dest/user.json"
              echo "::warning::$name config was not a ZIP; restored as user.json (re-run finish-setup.ps1 to update it)."
            fi
          }

          if [ -n "$LEGENDARY_CONFIG" ]; then
            restore "$LEGENDARY_CONFIG" "$HOME/.config/legendary" legendary
            if pip install --user legendary-gl; then
              echo "GAMEVAULT_LEGENDARY_BIN=$HOME/.local/bin/legendary" >> "$GITHUB_ENV"
            else
              echo "::warning::legendary install failed; Epic ownership will be skipped."
            fi
          fi
          if [ -n "$NILE_CONFIG" ]; then
            restore "$NILE_CONFIG" "$HOME/.config/nile" nile
            git clone --depth 1 https://github.com/imLinguin/nile.git /tmp/nile
            printf '\n[tool.setuptools.packages.find]\ninclude = ["nile*"]\n' >> /tmp/nile/pyproject.toml
            if pip install --user /tmp/nile; then
              echo "GAMEVAULT_NILE_BIN=$HOME/.local/bin/nile" >> "$GITHUB_ENV"
            else
              echo "::warning::nile install failed; Prime Gaming ownership will be skipped."
            fi
          fi

      - name: Build snapshot
        env:
          # Required for a public repo. Without it the build writes
          # plaintext and warns loudly.
          SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
          # Pricing and historical lows.
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          # Ownership.
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          # EA (formerly Origin). Origin's API is dead, but libraries moved to
          # the EA app and EA's Juno layer still serves them. EA_REMID is the
          # long-lived browser cookie, obtained with tools/ea-auth.mjs.
          EA_REMID: ${{ secrets.EA_REMID }}
          EA_SID: ${{ secrets.EA_SID }}
          # EA rotates remid on use, so the build must be able to write the
          # replacement back or EA works for exactly one build. Optional: a
          # fine-grained token with Secrets: Read and write on this repo.
          GAMEVAULT_SECRETS_TOKEN: ${{ secrets.GAMEVAULT_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Hand-entered ownership for stores with no API (Nintendo, Battle.net,
          # Rockstar). data/ is gitignored - a public repo must not contain a
          # list of what you own - so this secret is how it reaches the build.
          # Humble. Worth having even though most keys are Steam keys: an
          # UNREDEEMED key is a game you own that appears in no library at all.
          HUMBLE_SESSION: ${{ secrets.HUMBLE_SESSION }}
          # Epic session cookies, for claiming the weekly free games. Only the
          # payment host is involved and it is auth-gated rather than
          # bot-protected, so no browser impersonation is needed.
          EPIC_COOKIES: ${{ secrets.EPIC_COOKIES }}
          # Used to fetch the previous snapshot, so the claim log survives
          # between builds and last week's claims can be verified.
          SITE_URL: ${{ vars.SITE_URL }}
          MANUAL_LIBRARY: ${{ secrets.MANUAL_LIBRARY }}
          # Ubisoft Connect. Preferred is UBISOFT_REMEMBER_TICKET, obtained once
          # with tools/ubisoft-auth.mjs: it clears 2FA (which a password alone
          # cannot), grants only session creation, and is revocable on its own.
          # Email + password remain as a fallback for accounts without 2FA.
          UBISOFT_REMEMBER_TICKET: ${{ secrets.UBISOFT_REMEMBER_TICKET }}
          UBISOFT_EMAIL: ${{ secrets.UBISOFT_EMAIL }}
          UBISOFT_PASSWORD: ${{ secrets.UBISOFT_PASSWORD }}
          # Which Game Pass tier you actually pay for. Getting this wrong
          # makes the app claim a console-only game is "included".
          SUBSCRIPTIONS: ${{ vars.SUBSCRIPTIONS }}
          COUNTRY: ${{ vars.COUNTRY || 'US' }}
          # How many titles to price per build. Raise if the library outgrows
          # the default and prices start getting truncated.
          SNAPSHOT_PRICE_LIMIT: ${{ vars.SNAPSHOT_PRICE_LIMIT }}
        run: node tools/build-snapshot.mjs

      - name: Fail if the snapshot is unencrypted
        # A plaintext library in a public repo is the one outcome this
        # design must never produce silently.
        run: |
          if grep -q '"format":"gamevault-plain-snapshot"' site/snapshot.json; then
            echo "::error::Snapshot is NOT encrypted. Set the SNAPSHOT_PASSPHRASE secret."
            exit 1
          fi
          echo "Snapshot is encrypted."

      - name: Copy PWA assets
        # NOTE: manifest.webmanifest and sw.js are NOT copied from public/.
        # The site/ versions use RELATIVE paths because Pages serves from a
        # subdirectory; the public/ versions use absolute paths because the
        # local server serves from the root. Copying them over would
        # reintroduce the 404-on-launch bug.
        run: |
          cp public/icon-180.png public/icon-192.png public/icon-512.png \
             public/icon-maskable.png public/style.css site/
          cp lib/snapshot-crypto.mjs lib/github-secrets.mjs site/

      - name: Stamp the service-worker cache version
        # A constant cache name meant activate() never purged anything, so a
        # deployed fix could sit on the server while the installed app kept
        # serving the old copy. The cache name must change every build.
        run: |
          BUILD_ID="${GITHUB_RUN_NUMBER}-$(echo "$GITHUB_SHA" | cut -c1-7)"
          sed -i "s/__BUILD_ID__/${BUILD_ID}/g" site/sw.js
          if grep -q '__BUILD_ID__' site/sw.js; then
            echo "::error::sw.js build stamp was not applied - caches would never invalidate."
            exit 1
          fi
          grep -n 'const BUILD' site/sw.js
          echo "Service worker stamped as ${BUILD_ID}."

      - name: Report claim failures
        # The email half of "tell me when it breaks". An issue opened by the
        # Actions bot notifies the repository owner by email, which needs no
        # SMTP credentials and no third-party service.
        #
        # Rate-limited to one open issue: reopening or re-notifying every six
        # hours would train the user to ignore it, which defeats the purpose.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURES=$(node -e "
            const fs=require('fs');
            try{
              const m=JSON.parse(fs.readFileSync('site/snapshot-meta.json','utf8'));
              process.stdout.write(String(m.claimFailures||0));
            }catch{process.stdout.write('0')}
          ")
          [ "$FAILURES" = "0" ] && { echo "No claim failures."; exit 0; }

          EXISTING=$(gh issue list --state open --label claim-failure --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "A claim-failure issue is already open; not opening another."
            exit 0
          fi

          gh label create claim-failure --color d73a4a \
            --description "An automatic game claim did not arrive" 2>/dev/null || true
          gh issue create \
            --title "GameVault: $FAILURES automatic claim(s) did not arrive" \
            --label claim-failure \
            --body "The scheduled build claimed one or more free games, but they did not appear in your library on a later sync.

          A claim that Epic accepts can still fail to deliver, so success is judged by the game turning up in the library rather than by the HTTP response.

          Open the app to see which ones and claim them by hand:
          https://michaelens.github.io/gamevault/

          This issue will not be reopened while it stays open, so the six-hourly build will not keep mailing you. Close it once the games are claimed."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
